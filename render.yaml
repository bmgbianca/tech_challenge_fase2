services:
  - type: web
    name: rotas-ga-backend
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements-prod.txt
    startCommand: gunicorn backend.run:app --timeout 180 --workers 1
    envVars:
      - key: OPENROUTESERVICE_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        sync: false
      - key: CORS_ORIGINS
        sync: false
